# Licensing by path (REUSE specification 3.x). Files with their own SPDX header follow the header.
version = 1

[[annotations]]
path = ["cec-bridge/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 edgecoil"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

[[annotations]]
path = ["README.md", "cec-bridge/README.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 edgecoil"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["cec-bridge/edgecoil-mark.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 edgecoil"
SPDX-License-Identifier = "LicenseRef-edgecoil-trademark"

[[annotations]]
path = ["vendor/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 edgecoil"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["REUSE.toml", "cec-bridge/.gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 edgecoil"
SPDX-License-Identifier = "CC0-1.0"
